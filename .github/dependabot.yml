version: 2

# Grouping strategy (applies to every ecosystem below):
#
#   patch + minor version updates -> batched into one PR each, to keep the
#     review load low for changes that rarely break anything.
#   major version updates         -> grouped per lockstep package family
#     (Angular toolchain, EF Core provider set, test tooling); anything else
#     gets its own PR, so one breaking bump cannot block every other update.
#
# The reason for the split: a single "everything" group lets a breaking major
# bump block every other update in the same PR. That is exactly what happened
# with Scriban 7.1.0 -> 7.2.5, which closed two High-severity advisories
# (GHSA-24c8-4792-22hx, GHSA-7jvp-hj45-2f2m) but sat unmerged for three and a
# half months inside a 27-package group that also carried an NSubstitute 5 -> 6
# major bump.
#
# Why the per-family major groups: packages such as the Angular toolchain or
# the EF Core provider set must cross a major boundary in lockstep. Left
# ungrouped, each package gets its own PR and every one of those PRs fails CI,
# because it bumps one half of a set that has to move together.
#
# Measured on the 2026-09-08 run: major-type groups are not equally reliable
# across ecosystems. The npm groups produced their PRs. The nuget group did
# not: its group phase logged "No updatable version found for xunit.v3" while
# the same job later downloaded xunit.v3 4.0.0 and logged "skipped for
# ungrouped updates because it's a member of the following groups:
# nuget-test-major" -- no PR, no error, no explanation. The github-actions
# group crashed outright: all five actions failed with "No files changed!" in
# GithubActions::FileUpdater and nothing was opened. A missing update here
# therefore shows up as an absence, not as a failure. Check the Dependabot job
# logs (Insights -> Dependency graph -> Dependabot) before concluding that a
# dependency is up to date.
#
# What grouping deliberately does NOT cover: Dependabot Security Updates.
# `applies-to` defaults to version-updates, so no group here touches them --
# every security fix arrives as its own PR and none of them count against
# open-pull-requests-limit. That is the intended design, not an oversight:
# batching security fixes would recreate the Scriban failure mode, where one
# unmergeable bump holds back every advisory in the same PR. The consequence
# is that a repository with many vulnerable transitive dependencies will see a
# burst of individual PRs after the first run. Those are the fixes; merge
# them, do not group them away.
#
# Note on cooldown: GitHub applies a default 3-day cooldown to version
# updates, so a release that lands late in the week is not picked up until the
# following Monday run at the earliest. Security updates ignore cooldown.
# Uncomment the `cooldown` blocks below to tighten or loosen this.
#
# Note on `allow`: with no `allow` key, version updates cover only the
# dependencies declared in a manifest. Transitive packages are bumped solely
# by security updates (or as a side effect of a direct bump), which is why
# lockfile-only PRs are always security PRs here.

updates:
  # NuGet -- backend C# packages (.NET 10)
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      # Without this, `time` is interpreted as UTC (08:00 local in summer).
      timezone: "Europe/Budapest"
    # Grouped PRs count against this limit; version updates arriving on the
    # same run past the limit are withheld with no warning in the PR list.
    open-pull-requests-limit: 15
    # `labels` overrides Dependabot's defaults rather than adding to them, so
    # the ecosystem label has to be restated here. Every label listed must
    # already exist in the repository -- Dependabot only creates its own
    # default labels, and PR creation fails on a label it cannot find.
    # Verified present in this repository: dependencies, nuget, npm,
    # github-actions, ci.
    #
    # Note: no blanket "security" label here. Labelling every dependency PR
    # as security-related erases the distinction that matters when triaging.
    labels:
      - "dependencies"
      - "nuget"
    # cooldown:
    #   default-days: 3
    #   semver-major-days: 7
    #   semver-minor-days: 3
    #   semver-patch-days: 1
    groups:
      # --- lockstep major families (must be listed before the catch-all
      # --- patch/minor groups: a dependency only joins the first group it
      # --- matches, in file order)
      #
      # EF Core and its providers share a major line. Listed before the
      # ASP.NET group so that Microsoft.EntityFrameworkCore.* lands here.
      nuget-efcore-major:
        applies-to: version-updates
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql*"
        update-types:
          - "major"
      # The ASP.NET Core / Extensions packages ship on the .NET release
      # cadence and move together (currently 10.0.x).
      nuget-aspnetcore-major:
        applies-to: version-updates
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
        update-types:
          - "major"
      # Test-only majors cannot break shipped code, so batching them keeps the
      # NSubstitute-style bumps out of the way of application dependencies.
      # xunit.v3 and xunit.runner.visualstudio share a major line.
      nuget-test-major:
        applies-to: version-updates
        patterns:
          - "xunit*"
          - "NSubstitute*"
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"
        update-types:
          - "major"
      # --- everything else
      nuget-patch:
        applies-to: version-updates
        update-types:
          - "patch"
      nuget-minor:
        applies-to: version-updates
        update-types:
          - "minor"
    ignore:
      # Microsoft.OpenApi is pinned to 2.7.x on purpose: 2.7.5 closed
      # GHSA-v5pm-xwqc-g5wc / CVE-2026-49451, and 3.x is a breaking API
      # rewrite that the generated Api.json contract has not been ported to.
      # Patch and minor bumps inside 2.x still come through.
      - dependency-name: "Microsoft.OpenApi"
        update-types:
          - "version-update:semver-major"

  # npm -- Angular frontend packages (Angular 21)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 15
    labels:
      - "dependencies"
      - "npm"
    # cooldown:
    #   default-days: 3
    #   semver-major-days: 7
    #   semver-minor-days: 3
    #   semver-patch-days: 1
    groups:
      # The Angular toolchain has to cross a major boundary in one commit --
      # framework, CLI, build tooling, and the lint plugin that tracks the
      # Angular major. `angular-eslint` is spelled without the @angular/
      # scope, so it needs its own pattern or it drops out of the set.
      #
      # Treat the PR this group opens as a signal that a new Angular major is
      # out, not as a mergeable change: an Angular major is a migration, done
      # with `ng update @angular/core @angular/cli`, which also moves
      # TypeScript to the version the release pins and runs the schematics.
      #
      # `typescript` is deliberately not in this list. With a bare `typescript`
      # pattern the 2026-09-08 run pulled it to ~7.0.2, while @angular/build
      # 22.1.7 in the same PR pins typescript >=6.0 <6.1 -- the group's own two
      # bumps were incompatible and `npm ci` failed with ERESOLVE (PR #128).
      # See the ignore block below.
      npm-angular-major:
        applies-to: version-updates
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@ngtools/*"
          - "@schematics/*"
          - "angular-eslint"
          - "@ngx-translate/*"
          - "zone.js"
          - "rxjs"
        update-types:
          - "major"
      # Lint/format/test tooling: majors here are churn, not risk to the app.
      # Patterns match this project's actual devDependencies.
      #
      # `vitest` is deliberately not in this list: @angular/build pins the
      # vitest major it works with (peerOptional vitest ^4.0.8 on 21.2.x), so
      # a standalone vitest 5 bump fails `npm ci`. It moves with the Angular
      # build tooling instead. See the ignore block below.
      npm-tooling-major:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "prettier*"
          - "jsdom"
          - "lint-staged"
          - "simple-git-hooks"
          - "openapi-typescript"
          - "ng-openapi-gen"
          - "@types/*"
        update-types:
          - "major"
      npm-patch:
        applies-to: version-updates
        update-types:
          - "patch"
      npm-minor:
        applies-to: version-updates
        update-types:
          - "minor"
    ignore:
      # @angular/build dictates the major version of both of these: Angular
      # 22.1.7 pins typescript >=6.0 <6.1, and @angular/build 21.2.x pins
      # peerOptional vitest ^4.0.8. Dependabot cannot express "whatever the
      # Angular release allows", and both were verified to break `npm ci` with
      # ERESOLVE when bumped on their own (PRs #128 and #129, 2026-09-08).
      # They move with `ng update`, not as standalone bumps. Patch and minor
      # bumps inside the current major still come through.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions -- keep workflow action versions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Europe/Budapest"
    # Was previously unset, which meant the default of 5.
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    groups:
      # Action majors are independent of each other and are almost always a
      # tag bump, so one PR for all of them is fine.
      actions-major:
        applies-to: version-updates
        update-types:
          - "major"
      actions-patch:
        applies-to: version-updates
        update-types:
          - "patch"
      actions-minor:
        applies-to: version-updates
        update-types:
          - "minor"
