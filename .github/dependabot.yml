version: 2

updates:
  # NuGet -- backend C# packages
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    # Group all non-security updates into a single weekly PR
    # to reduce noise; security fixes always get individual PRs.
    groups:
      non-security-updates:
        applies-to: version-updates
        patterns:
          - "*"

  # npm -- Angular frontend packages
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # GitHub Actions -- keep workflow action versions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
