name: Security Scanning

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Run weekly even without code changes --
  # catches newly disclosed CVEs in unchanged dependencies.
  schedule:
    - cron: "0 3 * * 1"

jobs:

  # ── 1. CodeQL (SAST) ──────────────────────────────────────────────────────
  # Analyses C# source code for security vulnerabilities using
  # GitHub's CodeQL engine (OWASP-aligned query suite).
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore packages
        run: dotnet restore backend/Template.slnx

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # security-and-quality lefedi: cs/sql-injection, cs/path-injection,
          # cs/open-redirect, cs/hardcoded-credentials, cs/catch-of-all-exceptions,
          # cs/empty-catch-block és más High/Critical lekérdezéseket
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # CodeQL requires a successful build to trace the compilation.
      - name: Build (for CodeQL tracing)
        run: dotnet build backend/Template.slnx --no-restore

      # NOTE: github/codeql-action/analyze@v4 has no "fail-on" input for
      # advanced-setup workflows (verified against the v4 action.yml
      # manifest, 2026-09-07) -- it always exits 0 and only uploads SARIF.
      # The gate is enforced in the step below by reading the SARIF file
      # this step produces.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
          output: sarif-results
          # Results are uploaded to the GitHub Security tab as SARIF.

      - name: Enforce error-severity CodeQL threshold
        shell: bash
        run: |
          set -euo pipefail

          SARIF_FILE=$(find sarif-results -name '*.sarif' | head -n 1)
          if [ -z "$SARIF_FILE" ]; then
            echo "::error::No SARIF file produced by CodeQL analysis."
            exit 1
          fi

          # Threshold: only "error" severity fails the build.
          # security-and-quality code-quality queries such as
          # cs/empty-catch-block and cs/catch-of-all-exceptions are
          # "recommendation" severity (the lowest of error/warning/
          # recommendation, per https://codeql.github.com/codeql-query-help/csharp/)
          # and do not reach "error" level, so they do not block the build.
          # Only High/Critical security findings and @problem.severity=error
          # quality findings do. A result's level can be set directly on the
          # result object or fall back to the rule's defaultConfiguration.level.
          ERROR_COUNT=$(jq '
            [
              .runs[] as $run
              | $run.results[]
              | . as $result
              | ($result.level // ($run.tool.driver.rules[] | select(.id == $result.ruleId) | .defaultConfiguration.level) // "warning") as $level
              | select($level == "error")
            ] | length
          ' "$SARIF_FILE")

          echo "Found $ERROR_COUNT error-severity CodeQL finding(s) in $SARIF_FILE."

          if [ "$ERROR_COUNT" -gt 0 ]; then
            jq -r '
              .runs[] as $run
              | $run.results[]
              | . as $result
              | ($result.level // ($run.tool.driver.rules[] | select(.id == $result.ruleId) | .defaultConfiguration.level) // "warning") as $level
              | select($level == "error")
              | "  - " + $result.ruleId + " @ " + ($result.locations[0].physicalLocation.artifactLocation.uri // "unknown")
            ' "$SARIF_FILE"
            echo "::error::CodeQL found $ERROR_COUNT error-severity finding(s). Failing the build."
            exit 1
          fi

  # ── 2. NuGet vulnerability audit (SCA) ───────────────────────────────────
  # Uses the built-in dotnet CLI audit command -- no third-party action
  # needed. Fails the job if any HIGH or CRITICAL vulnerability is found
  # in the dependency graph.
  nuget-audit:
    name: NuGet dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore packages
        run: dotnet restore backend/Template.slnx

      - name: Audit NuGet packages
        # --severity high  → only fail on High and Critical advisories
        # --vulnerable     → only list packages with known vulnerabilities
        shell: bash
        run: |
          set -euo pipefail

          # --include-transitive: tranzitív függőségek is belekerülnek
          # A JSON kimenet a ténylegesen feloldott verziókat tartalmazza
          dotnet list backend/Template.slnx package \
            --vulnerable \
            --include-transitive \
            --format json \
            > nuget-audit.json

          cat nuget-audit.json

          # Exit non-zero if any HIGH or CRITICAL vulnerability found.
          CRITICAL=$(cat nuget-audit.json \
            | jq '[.. | objects | select(.severity? == "High" or .severity? == "Critical")] | length')
          
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Found $CRITICAL High/Critical NuGet vulnerability(s). See nuget-audit.json."
            exit 1
          fi

      - name: Upload NuGet audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-audit
          path: nuget-audit.json

  # ── 3. Secret scanning (gitleaks) ────────────────────────────────────────
  # Scans the entire commit history for accidentally committed secrets
  # (API keys, passwords, connection strings, etc.).
  # GitHub's built-in secret scanning covers the same ground for
  # public repositories and GitHub Advanced Security customers; gitleaks
  # provides the same capability for all repository types in CI.
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed to scan all commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Egyedi szabályfájl: kiterjeszti az alapértelmezett szabályokat
          # ASP.NET Core-specifikus mintákkal (JWT titok, connection string, stb.)
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
