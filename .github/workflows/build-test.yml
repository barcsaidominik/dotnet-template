name: Build & Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-test:
    name: dotnet build + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      # Directory.Packages.props (CPM) closes off per-csproj `Version="…"` on
      # PackageReference — that's an NU1008 build error. `VersionOverride`
      # is not: it's a legal, silent, per-project escape hatch back to the
      # same drift CPM exists to prevent, so it needs its own gate here.
      - name: No package versions in csproj (CPM)
        shell: bash
        run: |
          if grep -rn -E 'PackageReference[^>]*(Version|VersionOverride)=' --include='*.csproj' backend/; then
            echo "::error::Verziószám a csprojban — a verziók a Directory.Packages.props-ba tartoznak (CPM). VersionOverride sem megengedett."
            exit 1
          fi

      - name: Restore
        run: dotnet restore backend/Template.slnx

      - name: Build
        run: dotnet build backend/Template.slnx --no-restore -warnaserror

      # Template.Tests uses Microsoft.EntityFrameworkCore.InMemory for its
      # integration tests (see IntegrationTestWebApplicationFactory.cs /
      # ProductsIntegrationTestWebApplicationFactory.cs) -- no Testcontainers,
      # no Docker, no external database needed on the runner.
      # global.json opts `dotnet test` into Microsoft.Testing.Platform (MTP)
      # mode, which xunit.v3 4.x requires. In MTP mode the project path must be
      # passed via `--project`, not positionally:
      # https://learn.microsoft.com/dotnet/core/testing/unit-testing-with-dotnet-test#migrate-to-mtp-mode-of-dotnet-test
      - name: Test
        run: dotnet test --project backend/tests/Template.Tests/Template.Tests.csproj --no-build

  # Until now the frontend had no CI gate at all: no `npm ci`, no lint, no
  # build, no test. That let a peer-dependency conflict and an Angular
  # version split land on master unnoticed.
  frontend:
    name: npm ci + lint + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # simple-git-hooks' `prepare` script installs local git hooks, which
      # is documented (SKIP_INSTALL_SIMPLE_GIT_HOOKS) as skippable for CI:
      # https://github.com/toplenboren/simple-git-hooks#i-want-to-skip-git-hooks
      # This is preferred over `npm ci --ignore-scripts`, which would also
      # skip esbuild's postinstall (needed for its native binary that
      # @angular/build relies on) and break the subsequent build step.
      - name: Install
        run: npm ci
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run
