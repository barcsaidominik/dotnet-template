name: Style Check

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/Template.slnx

      - name: Verify formatting and code style
        run: dotnet format backend/Template.slnx --verify-no-changes --severity error --no-restore
