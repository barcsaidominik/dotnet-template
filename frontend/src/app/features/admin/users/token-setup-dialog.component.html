<h2 mat-dialog-title>Meghívó elküldve</h2>
<mat-dialog-content>
  <p>A meghívó emailt elküldtük a megadott email címre.</p>
  <p>A felhasználó az emailben kapott linkre kattintva beállíthatja jelszavát és aktiválhatja fiókját.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" mat-dialog-close>OK</button>
</mat-dialog-actions>
