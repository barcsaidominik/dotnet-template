<h2 mat-dialog-title>{{ 'admin.facilities.createDialog.title' | translate }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="confirm()">
    <mat-form-field appearance="outline" style="width: 100%; margin-top: 8px">
      <mat-label>{{ 'admin.facilities.createDialog.name' | translate }}</mat-label>
      <input matInput formControlName="name" />
      @if (form.get('name')?.hasError('required') && form.get('name')?.touched) {
        <mat-error>{{ 'admin.facilities.createDialog.nameRequired' | translate }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ 'common.cancel' | translate }}</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="confirm()">
    {{ 'admin.facilities.createDialog.submit' | translate }}
  </button>
</mat-dialog-actions>
