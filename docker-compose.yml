services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEMPLATE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TEMPLATE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${TEMPLATE_DB_NAME:-template_db}
    ports:
      - "5432:5432"
    volumes:
      - C:\DB\postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.GatewayApi
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ReverseProxy__Clusters__core-api__Destinations__destination1__Address: "http://core-api:8080/"
      ReverseProxy__Clusters__products-api__Destinations__destination1__Address: "http://products-api:8080/"
    depends_on:
      core-api:
        condition: service_started
      products-api:
        condition: service_started

  core-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - dataprotection-keys:/app/keys
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${TEMPLATE_DB_NAME:-template_db};Username=${TEMPLATE_DB_USER:-postgres};Password=${TEMPLATE_DB_PASSWORD:-postgres}"
      JwtSettings__Secret: "${TEMPLATE_JWT_SECRET}"
      InternalServiceAuth__Token: "${TEMPLATE_INTERNAL_SERVICE_TOKEN}"
      ProductsService__GrpcBaseUrl: "http://products-api:8081"
    secrets:
      - jwt_secret
      - internal_service_token
    depends_on:
      db:
        condition: service_healthy
      products-api:
        condition: service_started

  products-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.ProductsApi
    restart: unless-stopped
    volumes:
      - dataprotection-keys:/app/keys
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${TEMPLATE_DB_NAME:-template_db};Username=${TEMPLATE_DB_USER:-postgres};Password=${TEMPLATE_DB_PASSWORD:-postgres}"
      JwtSettings__Secret: "${TEMPLATE_JWT_SECRET}"
      InternalServiceAuth__Token: "${TEMPLATE_INTERNAL_SERVICE_TOKEN}"
      Kestrel__Endpoints__Http__Url: "http://0.0.0.0:8080"
      Kestrel__Endpoints__Grpc__Url: "http://0.0.0.0:8081"
    secrets:
      - jwt_secret
      - internal_service_token
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  dataprotection-keys:

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  internal_service_token:
    file: ./secrets/internal_service_token.txt
