services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEMPLATE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TEMPLATE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${TEMPLATE_DB_NAME:-template_db}
    ports:
      - "5432:5432"
    volumes:
      # named volume (nem host bind mount), hogy a `docker compose down -v` valóban
      # reseteljen és a compose ne tartalmazzon gépspecifikus abszolút útvonalat
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.GatewayApi
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      core-api:
        condition: service_started
      products-api:
        condition: service_started

  db-migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile.Migrator
    # "no", nem "unless-stopped": ez egyszer lefutó job, service_completed_successfully
    # csak akkor működik, ha a konténer tényleg leáll a sikeres futás után és nem indul
    # újra. Ne másold ide a többi service restart policy-ját.
    restart: "no"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${TEMPLATE_DB_NAME:-template_db};Username=${TEMPLATE_DB_USER:-postgres};Password=${TEMPLATE_DB_PASSWORD:-postgres}"
    depends_on:
      db:
        condition: service_healthy

  core-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - dataprotection-keys:/app/keys
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${TEMPLATE_DB_NAME:-template_db};Username=${TEMPLATE_DB_USER:-postgres};Password=${TEMPLATE_DB_PASSWORD:-postgres}"
      JwtSettings__Secret: "${TEMPLATE_JWT_SECRET}"
      InternalServiceAuth__Token: "${TEMPLATE_INTERNAL_SERVICE_TOKEN}"
      ProductsService__GrpcBaseUrl: "http://products-api:8081"
    secrets:
      - jwt_secret
      - internal_service_token
    depends_on:
      db:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully

  products-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.ProductsApi
    restart: unless-stopped
    volumes:
      - dataprotection-keys:/app/keys
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${TEMPLATE_DB_NAME:-template_db};Username=${TEMPLATE_DB_USER:-postgres};Password=${TEMPLATE_DB_PASSWORD:-postgres}"
      JwtSettings__Secret: "${TEMPLATE_JWT_SECRET}"
      InternalServiceAuth__Token: "${TEMPLATE_INTERNAL_SERVICE_TOKEN}"
      Kestrel__Endpoints__Http__Url: "http://0.0.0.0:8080"
      Kestrel__Endpoints__Grpc__Url: "http://0.0.0.0:8081"
    secrets:
      - jwt_secret
      - internal_service_token
    depends_on:
      db:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  dataprotection-keys:
  postgres-data:

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  internal_service_token:
    file: ./secrets/internal_service_token.txt
