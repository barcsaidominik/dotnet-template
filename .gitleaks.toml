title = "dotnet-template Gitleaks Configuration"

[extend]
useDefault = true

# ─────────────────────────────────────────────────────────────────
# 1. JWT Secret alapérték C# property-ben
#    Megtalálja: public string Secret { get; set; } = "valami..."
#    FIGYELEM: keywords mező szándékosan hiányzik — Gitleaks 8.x a
#    keywords-t a kinyert secret VALUE ellen ellenőrzi, nem a sor ellen.
#    A tényleges secret érték mellett nem feltétlenül lesz ott "Secret" szó, ezért keywords = block.
# ─────────────────────────────────────────────────────────────────
[[rules]]
id          = "dotnet-jwt-secret-default-value"
description = "Hardcoded JWT secret as C# property default value"
regex       = '''(?i)(?:Secret|JwtSecret|TokenSecret|SigningKey)\s*\{[^}]*\}\s*=\s*["']([A-Za-z0-9!@#$%^&*\-_=+]{8,})["']'''
secretGroup = 1
tags        = ["jwt", "secret", "csharp"]

  [rules.allowlist]
  description = "Ignore empty strings and placeholder values"
  regexes = [
    '''string\.Empty''',
    '''(?i)(placeholder|example|dummy|test|fake)''',
  ]

# ─────────────────────────────────────────────────────────────────
# 2. ASP.NET connection string jelszó
# ─────────────────────────────────────────────────────────────────
[[rules]]
id          = "dotnet-connection-string-password"
description = "Password in ASP.NET connection string"
regex       = '''(?i)(?:Password|pwd)\s*=\s*([^;"{}\s]{4,})'''
secretGroup = 1
tags        = ["database", "connection-string", "csharp"]

  [rules.allowlist]
  description = "Ignore placeholders and test projects"
  paths = [
    '''.*[Tt]est.*''',
    '''.*[Ee]xample.*''',
    '''appsettings\.Development\.json''',
  ]
  regexes = [
    '''\$\{''',
    '''string\.Empty''',
    '''(?i)(your|change|replace|placeholder|example|dummy|test|fake)''',
    '''\*+''',
  ]

# ─────────────────────────────────────────────────────────────────
# 3. Hardcode-olt API kulcs / token C# kódban
# ─────────────────────────────────────────────────────────────────
[[rules]]
id          = "dotnet-hardcoded-api-key-property"
description = "Hardcoded API key or token assigned to C# property"
regex       = '''(?i)(?:ApiKey|api_key|AuthToken|AccessToken|ServiceToken)\s*(?:=|:)\s*["']([A-Za-z0-9\-_\.]{16,})["']'''
secretGroup = 1
tags        = ["api-key", "token", "csharp"]

  [rules.allowlist]
  paths = [
    '''.*[Tt]est.*''',
    '''.*[Ss]pec.*''',
  ]
  regexes = [
    '''string\.Empty''',
    '''Environment\.GetEnvironmentVariable''',
    '''configuration\[''',
  ]

# ─────────────────────────────────────────────────────────────────
# 4. Docker Compose hardcode-olt jelszó
# ─────────────────────────────────────────────────────────────────
[[rules]]
id          = "docker-compose-hardcoded-password"
description = "Hardcoded password in Docker Compose or .env file"
regex       = '''(?i)(?:POSTGRES_PASSWORD|MYSQL_PASSWORD|MSSQL_SA_PASSWORD|DB_PASSWORD)\s*=\s*([^\s$"]{4,})'''
secretGroup = 1
tags        = ["docker", "database", "password"]

  [rules.allowlist]
  paths = [
    '''.*\.example''',
    '''.*\.sample''',
    '''.*[Tt]est.*''',
  ]

# ─────────────────────────────────────────────────────────────────
# Globális kizárások
# ─────────────────────────────────────────────────────────────────
[allowlist]
description = "Global allowlist for generated and test files"
paths = [
  '''.*\.g\.cs$''',
  '''.*\.designer\.cs$''',
  '''.*[Mm]igration.*\.cs$''',
  '''.*[Gg]enerated.*''',
]
